---
# Mechanics / layout — rarely changed. The per-environment knobs (version, heap,
# cluster_id, durability, retention) live in group_vars/kafka.yaml.
kafka_scala_version: "2.13"
kafka_download_base: "https://archive.apache.org/dist/kafka"

kafka_user: kafka
kafka_group: kafka
kafka_install_dir: /opt
kafka_home: /opt/kafka
kafka_data_dir: /var/lib/kafka/data        # on the dedicated LVM mount /var/lib/kafka
kafka_log_dir: /var/log/kafka

kafka_client_port: 9092                      # PLAINTEXT clients
kafka_controller_port: 9093                  # KRaft controller quorum
