---
- name: 'kafka | Create group'
  group:
    name: "{{ kafka_group }}"
    system: true

- name: 'kafka | Create user'
  user:
    name: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ kafka_home }}"
    create_home: false

- name: 'kafka | Ensure data and log directories'
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: '0755'
  loop:
    - "{{ kafka_data_dir }}"
    - "{{ kafka_log_dir }}"

- name: 'kafka | Check whether {{ kafka_version }} is already unpacked'
  stat:
    path: "{{ kafka_install_dir }}/kafka_{{ kafka_scala_version }}-{{ kafka_version }}"
  register: kafka_dist

- name: 'kafka | Download Apache Kafka {{ kafka_version }}'
  get_url:
    url: "{{ kafka_download_base }}/{{ kafka_version }}/kafka_{{ kafka_scala_version }}-{{ kafka_version }}.tgz"
    dest: "/tmp/kafka_{{ kafka_scala_version }}-{{ kafka_version }}.tgz"
    mode: '0644'
    timeout: 120
  register: kafka_dl
  until: kafka_dl is success
  retries: 3
  delay: 10
  when: not kafka_dist.stat.exists

- name: 'kafka | Unpack distribution'
  unarchive:
    src: "/tmp/kafka_{{ kafka_scala_version }}-{{ kafka_version }}.tgz"
    dest: "{{ kafka_install_dir }}"
    remote_src: true
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
  when: not kafka_dist.stat.exists

- name: 'kafka | Symlink {{ kafka_home }} -> current version'
  file:
    src: "{{ kafka_install_dir }}/kafka_{{ kafka_scala_version }}-{{ kafka_version }}"
    dest: "{{ kafka_home }}"
    state: link
  notify: restart kafka

- name: 'kafka | Deploy server.properties'
  template:
    src: server.properties.j2
    dest: "{{ kafka_home }}/config/server.properties"
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: '0600'                             # contains the admin SASL password
  notify: restart kafka

- name: 'kafka | Deploy admin client config'
  template:
    src: admin-client.properties.j2
    dest: "{{ kafka_home }}/config/admin-client.properties"
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: '0600'

- name: 'kafka | Format KRaft storage (once, bootstraps admin SCRAM creds)'
  command: >
    {{ kafka_home }}/bin/kafka-storage.sh format
    -t {{ kafka_cluster_id }}
    -c {{ kafka_home }}/config/server.properties
    --add-scram {{ ('SCRAM-SHA-512=[name=' ~ kafka_admin_user ~ ',password=' ~ kafka_admin_password ~ ']') | quote }}
  args:
    creates: "{{ kafka_data_dir }}/meta.properties"
  no_log: "{{ kafka_no_log }}"

- name: 'kafka | Ensure data/log ownership'
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    recurse: true
  loop:
    - "{{ kafka_data_dir }}"
    - "{{ kafka_log_dir }}"

- name: 'kafka | Deploy systemd unit'
  template:
    src: kafka.service.j2
    dest: /etc/systemd/system/kafka.service
    mode: '0644'
  notify:
    - reload systemd
    - restart kafka

- name: 'kafka | Enable and start'
  systemd:
    name: kafka
    enabled: true
    state: started
    daemon_reload: true

# Apply any pending config/unit restart now: the checks below must observe the
# broker running the just-deployed config, not the previous one.
- name: 'kafka | Flush handlers'
  meta: flush_handlers

- name: 'kafka | Wait for client listener'
  wait_for:
    host: 127.0.0.1
    port: "{{ kafka_client_port }}"
    timeout: 120

# --- SCRAM client users. No authorizer is configured, so every user created
# here has full access. Create-only: existing users are not touched (password
# change in vars has no effect) and users removed from the list are not deleted.
- name: 'kafka | List existing SCRAM users'
  command: >
    {{ kafka_home }}/bin/kafka-configs.sh
    --bootstrap-server 127.0.0.1:{{ kafka_client_port }}
    --command-config {{ kafka_home }}/config/admin-client.properties
    --describe --entity-type users
  register: kafka_scram_users
  changed_when: false
  until: kafka_scram_users is success
  retries: 5
  delay: 10
  run_once: true

- name: 'kafka | Create SCRAM credentials for client users'
  command: >
    {{ kafka_home }}/bin/kafka-configs.sh
    --bootstrap-server 127.0.0.1:{{ kafka_client_port }}
    --command-config {{ kafka_home }}/config/admin-client.properties
    --alter --entity-type users --entity-name {{ item.username | quote }}
    --add-config {{ ('SCRAM-SHA-512=[password=' ~ item.password ~ ']') | quote }}
  loop: "{{ kafka_client_users }}"
  loop_control:
    label: "{{ item.username }}"
  when: ("'" ~ item.username ~ "'") not in kafka_scram_users.stdout
  run_once: true
  no_log: "{{ kafka_no_log }}"
